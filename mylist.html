<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akatsuki - My List</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body class="dark-mode">

    <div id="preloader">
        <div class="slime"></div>
        <div class="loader-text">LOADING...</div>
    </div>

    <nav class="navbar">
        <a href="home.html" class="nav-brand-link">
            <div class="nav-brand">
                <img src="default.png" alt="Logo" class="brand-img"> Akatsuki
            </div>
        </a>
        <div class="user-controls">
            <a href="mylist.html" class="nav-link active">My List</a>
            <a href="discover.html" class="nav-link">Browse</a>
            <span id="user-display" class="user-name" onclick="window.location.href='account.html'">Loading...</span>
            <img src="default.png" class="nav-avatar-mobile" alt="Profile" onclick="window.location.href='account.html'">
            <button id="logout-btn" class="btn-logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </nav>

    <div class="mylist-container">
        <div class="section-title">My Anime List</div>

        <div class="list-filters">
            <button class="filter-btn active" onclick="filterList('all')">All Anime</button>
            <button class="filter-btn" onclick="filterList('watching')">Watching</button>
            <button class="filter-btn" onclick="filterList('completed')">Completed</button>
            <button class="filter-btn" onclick="filterList('planning')">Planning</button>
            <button class="filter-btn" onclick="filterList('dropped')">Dropped</button>
        </div>

        <div id="my-anime-list-container">
            <p style="color: #999; text-align: center; padding: 30px;">Loading your list...</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="app.js"></script>
</body>
</html>
